<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simulator Slot (Belajar)</title>
  <style>
    body { font-family: system-ui, Arial; display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px;background:#0b1220;color:#e6eef8 }
    .machine { background:linear-gradient(180deg,#123,#045); padding:20px;border-radius:12px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
    .reels { display:flex; gap:12px; margin-bottom:12px; }
    .reel { width:90px;height:90px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:#111; }
    button{ padding:10px 18px;border-radius:10px;border:0;background:#1fb6ff;color:#012; font-weight:700; cursor:pointer;}
    .info { margin-top:8px;font-size:14px; color:#bcd; text-align:center; max-width:420px; }
    .controls { display:flex; gap:8px; align-items:center; justify-content:center; margin-top:8px; }
  </style>
</head>
<body>
  <h1>Simulator Slot — Belajar Aman</h1>
  <div class="machine">
    <div class="reels">
      <div class="reel" id="r0">🍒</div>
      <div class="reel" id="r1">🍋</div>
      <div class="reel" id="r2">7</div>
    </div>
    <div style="display:flex;gap:10px;justify-content:center">
      <div>Saldo: Rp <span id="balance">100000</span></div>
      <div>Taruhan: Rp <input id="bet" type="number" value="1000" min="100" step="100" style="width:110px"></div>
    </div>
    <div class="controls">
      <button id="spin">SPIN</button>
      <button id="reset">RESET SALDO</button>
      <label style="color:#bcd">Auto: <input type="checkbox" id="auto"></label>
    </div>
    <div class="info" id="msg">
      Ini simulasi lokal. Di sistem nyata, hasil seharusnya ditentukan di server, dan RNG harus menggunakan CSPRNG di sisi server.
    </div>
  </div>

  <script>
    // Simbol dan probabilitas sederhana (bisa diubah untuk eksperimen)
    const symbols = [
      {sym:'🍒', weight:30, payout:2},
      {sym:'🍋', weight:25, payout:2},
      {sym:'🔔', weight:20, payout:5},
      {sym:'⭐', weight:15, payout:10},
      {sym:'7',   weight:10, payout:50},
    ];

    // buat array berdasarkan weight untuk sampling sederhana
    const pool = [];
    symbols.forEach(s => { for(let i=0;i<s.weight;i++) pool.push({sym:s.sym,payout:s.payout}); });

    const rEls = [document.getElementById('r0'), document.getElementById('r1'), document.getElementById('r2')];
    const balanceEl = document.getElementById('balance');
    const betEl = document.getElementById('bet');
    const msgEl = document.getElementById('msg');
    const spinBtn = document.getElementById('spin');
    const resetBtn = document.getElementById('reset');
    const autoCb = document.getElementById('auto');

    let balance = Number(balanceEl.textContent);

    function randInt(max){ return Math.floor(Math.random()*max); } // untuk simulasi lokal
    function sampleSymbol(){ return pool[randInt(pool.length)]; }

    function evaluate(reels, bet){
      // sederhana: 3 sama = jackpot; 2 sama = small win
      const s0 = reels[0].sym, s1 = reels[1].sym, s2 = reels[2].sym;
      if(s0===s1 && s1===s2){
        const payoutMultiplier = reels[0].payout;
        return {win:true, amount: bet * payoutMultiplier, desc:`3x ${s0} => x${payoutMultiplier}`};
      } else if (s0===s1 || s1===s2 || s0===s2){
        // pick matched symbol payout (approx)
        const matched = s0===s1 ? reels[0] : (s1===s2 ? reels[1] : reels[0]);
        return {win:true, amount: Math.floor(bet * (matched.payout/4)), desc:`2 matching => small win`};
      } else {
        return {win:false, amount:0, desc:'Kalah'};
      }
    }

    function animateSpin(resultReels, callback){
      const spins = 12;
      let i=0;
      const iv = setInterval(()=>{
        rEls.forEach((el,idx)=>{
          const sym = pool[(randInt(pool.length)+i+idx*3)%pool.length].sym;
          el.textContent = sym;
        });
        i++;
        if(i>=spins){ clearInterval(iv); rEls.forEach((el,idx)=> el.textContent = resultReels[idx].sym); callback(); }
      }, 70);
    }

    function doSpin(){
      const bet = Number(betEl.value) || 0;
      if(bet<=0 || bet>balance){ msgEl.textContent = 'Taruhan tidak valid atau saldo tidak cukup.'; return; }
      balance -= bet;
      updateBalance();

      const resultReels = [sampleSymbol(), sampleSymbol(), sampleSymbol()];
      animateSpin(resultReels, ()=>{
        const res = evaluate(resultReels, bet);
        if(res.win){
          balance += res.amount;
          msgEl.textContent = `MENANG! ${res.desc} — Dapat Rp ${res.amount}`;
        } else {
          msgEl.textContent = `Kalah. ${res.desc}`;
        }
        updateBalance();
        if(autoCb.checked && balance>0) setTimeout(doSpin, 200);
      });
    }

    function updateBalance(){ balanceEl.textContent = balance; }

    spinBtn.addEventListener('click', doSpin);
    resetBtn.addEventListener('click', ()=>{ balance = 100000; updateBalance(); msgEl.textContent='Saldo direset.'; });
  </script>
</body>
</html>
